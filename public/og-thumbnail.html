<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>뜀로그 OG 썸네일</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E9E6DF; }

/* 800x400 — KakaoTalk OG ratio (2:1) */
.og {
  width: 800px;
  height: 400px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(680px 420px at 78% 8%, #CFEFE2 0%, transparent 62%),
    radial-gradient(520px 380px at 6% 96%, #FFE9D9 0%, transparent 60%),
    #DBF1E9;
  font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
}

/* dotted map texture */
.og .dots {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(47,139,110,0.16) 1.6px, transparent 1.6px);
  background-size: 30px 30px;
  background-position: 8px 8px;
  mask-image: linear-gradient(120deg, rgba(0,0,0,0.5), transparent 70%);
  -webkit-mask-image: linear-gradient(120deg, rgba(0,0,0,0.5), transparent 70%);
}

/* decorative route line sweeping across */
.og .route {
  position: absolute; inset: 0;
  pointer-events: none;
}

/* content */
.og .inner {
  position: relative;
  z-index: 3;
  padding: 0 52px;
  display: flex;
  align-items: center;
  gap: 36px;
  width: 100%;
}

/* shoe badge */
.badge {
  width: 156px; height: 156px;
  border-radius: 44px;
  background: #FFFFFF;
  box-shadow: 0 18px 36px -14px rgba(47,107,80,0.42), 0 3px 8px rgba(47,107,80,0.12);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.badge .ring {
  position: absolute; inset: 12px;
  border-radius: 32px;
  border: 2.5px dashed rgba(47,139,110,0.28);
}

.copy { min-width: 0; flex: 1; }
.kicker {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.78);
  border: 1.5px solid rgba(47,139,110,0.22);
  padding: 6px 14px 6px 11px;
  border-radius: 999px;
  font-size: 15px; font-weight: 700; color: #2F8B6E;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
  white-space: nowrap;
}
.kicker .pin {
  width: 9px; height: 9px; border-radius: 999px; background: #6FC2A6; flex-shrink: 0;
}
.title {
  font-size: 72px; font-weight: 800; color: #2C2A29;
  letter-spacing: -0.04em; line-height: 1;
  white-space: nowrap;
}
.title .log { color: #6FC2A6; }
.sub {
  margin-top: 16px;
  font-size: 22px; font-weight: 600; color: #4A423D;
  letter-spacing: -0.02em; line-height: 1.45;
}
.sub b { color: #2C2A29; font-weight: 800; }

/* corner watermark */
.host {
  position: absolute; right: 30px; bottom: 22px; z-index: 3;
  font-size: 15px; font-weight: 700; color: rgba(44,42,41,0.42);
  letter-spacing: 0.01em;
}
</style>
</head>
<body>
<div class="og" id="og">
  <div class="dots"></div>
  <svg class="route" viewBox="0 0 800 400" preserveAspectRatio="none">
    <path d="M-40 300 C 140 250, 200 360, 360 300 C 520 240, 600 330, 880 250"
          fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
    <path d="M-40 300 C 140 250, 200 360, 360 300 C 520 240, 600 330, 880 250"
          fill="none" stroke="#6FC2A6" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <circle cx="120" cy="284" r="9" fill="#FFFFFF" stroke="#6FC2A6" stroke-width="4"/>
    <circle cx="690" cy="276" r="8" fill="#FF9BA6"/>
  </svg>

  <div class="inner">
    <div class="badge">
      <div class="ring"></div>
      <svg width="92" height="80" viewBox="0 0 28 24" fill="none" aria-hidden="true">
        <path d="M2.2 16.8c0-1 .6-1.5 1.6-1.6l4-.4 3.5-2.4c1-.7 2-1.1 3.2-1.1h4.6c1.6 0 3 .5 4 1.5l3.3 3.2c.7.7 1 1.5 1 2.4 0 1.4-1.1 2.4-2.5 2.4H5.3c-1.7 0-3.1-1.3-3.1-2.9 0-.4 0-.7 0-1.1z" fill="#2C2A29"/>
        <path d="M7.6 14.6l3.5-3 1.2-2c.5-.8 1.4-1.3 2.3-1.1l3.8.6c.9.2 1.6 1 1.6 2v2.8" stroke="#2C2A29" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12.4 12.4l1-.6M14 11.6l1.4-.8M15.8 10.9l1.5-.7" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M4 18.4h22" stroke="#fff" stroke-width="0.9" stroke-linecap="round"/>
        <circle cx="25.5" cy="9" r="2" fill="#FFCF4D"/>
      </svg>
    </div>

    <div class="copy">
      <div class="kicker"><span class="pin"></span>지도 위에 그리는 러닝 코스</div>
      <div class="title">뜀<span class="log">로그</span></div>
      <div class="sub">동네 러닝 코스를 미리 그려보고<br/><b>공유해요</b> 🏃</div>
    </div>
  </div>

  <div class="host">dduim.log</div>
</div>
</body>
</html>
